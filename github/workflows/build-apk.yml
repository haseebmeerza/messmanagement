name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png www/

      - name: Install Capacitor and add Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Set app icon (HM logo)
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os, shutil
          src = Image.open("icon-512.png").convert("RGBA")
          res = "android/app/src/main/res"
          for d, s in {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}.items():
              p = f"{res}/mipmap-{d}"
              os.makedirs(p, exist_ok=True)
              for n in ("ic_launcher.png","ic_launcher_round.png","ic_launcher_foreground.png"):
                  src.resize((s, s), Image.LANCZOS).save(f"{p}/{n}")
          shutil.rmtree(f"{res}/mipmap-anydpi-v26", ignore_errors=True)
          PY

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HM-Mess.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HM-Mess-APK
          path: HM-Mess.apk

      - name: Publish release (download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: HM Mess APK build ${{ github.run_number }}
          files: HM-Mess.apk
