<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Haseeb Mirza Mess Management</title><meta name="theme-color" content="#1f4d3a">
<style>
:root{--g:#1f4d3a;--c:#faf5e9;--t:#c2572b;--gold:#b8963e;--ink:#2b2b2b;--wa:#25D366}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;background:var(--c);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
header{background:var(--g);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:20}
header b{font-size:1.1em}
nav{position:sticky;top:55px;z-index:19;background:#fff;border-bottom:2px solid var(--gold);display:flex;gap:6px;overflow-x:auto;padding:7px 10px;white-space:nowrap;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:0;background:#f3ede0;color:#555;padding:7px 14px;border-radius:99px;font:inherit;font-size:.86em;font-weight:600;cursor:pointer}
nav button.on{background:var(--t);color:#fff}
main{flex:1;padding:14px;max-width:1000px;width:100%;margin:0 auto}
.search{width:100%;padding:11px 14px;border:1.5px solid #d5ccb4;border-radius:12px;font:inherit;background:#fff;margin-bottom:8px}
.cash{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.cash div{border-radius:14px;padding:12px 14px;color:#fff;box-shadow:0 3px 10px #0000001a}
.cash .a{background:linear-gradient(135deg,#1f4d3a,#2d6e53)}.cash .b{background:linear-gradient(135deg,#c2572b,#d96b3d)}
.cash small{display:block;font-size:.78em;opacity:.92}.cash b{font-size:1.45em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:#fff;border-radius:12px;padding:10px 6px;text-align:center;box-shadow:0 2px 6px #0000000d}
.stat b{display:block;font-size:1.3em;color:var(--g)}.stat small{font-size:.72em;color:#666}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chip{flex:0 0 auto;background:#fff;border:1px solid #d5ccb4;padding:6px 12px;border-radius:99px;font-size:.82em;cursor:pointer;font-weight:600}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.cc{background:#fff;border-radius:14px;padding:12px;margin:8px 0;box-shadow:0 2px 8px #0000000f;border-left:4px solid var(--g);display:flex;flex-direction:column;gap:8px}
.cc.Expiring{border-left-color:var(--gold)}.cc.Expired,.cc.Cancelled,.cc.Hold{border-left-color:var(--t)}
.top{display:flex;align-items:center;gap:10px;cursor:pointer}
.av{width:42px;height:42px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.cl{flex:1;min-width:0}.cl b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cl small{display:block;color:#666;font-size:.82em}
.cr{text-align:right;flex:none}
.tag{display:inline-block;font-size:.74em;font-weight:700;padding:3px 9px;border-radius:99px}
.Active{background:#d8ecd9;color:#1f4d3a}.Expiring{background:#fde6b8;color:#8a5a00}.Expired,.Cancelled{background:#f6c9bb;color:#9e2a14}.Hold{background:#e3e3e3;color:#444}
.due{display:block;font-size:.82em;font-weight:700;margin-top:3px;color:var(--t)}.ok{color:var(--g)}
.cb{display:flex;gap:6px}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:9px 12px;font:inherit;font-size:.84em;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.btn.t{background:var(--t)}.btn.wa{background:var(--wa)}.btn.o{background:#fff;color:var(--g);border:1px solid var(--g)}.cb .btn{flex:1;padding:8px 6px}
.box{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 8px #0000000f;margin-bottom:12px}
label{font-size:.84em;color:#555;display:block;margin-top:6px;font-weight:600}
input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:9px;font:inherit;margin:4px 0 8px;background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#modal{position:fixed;inset:0;background:#00000075;display:none;align-items:center;justify-content:center;padding:14px;z-index:50}
#modal.open{display:flex}
#mc{background:var(--c);border-radius:16px;padding:16px;max-width:460px;width:100%;max-height:90vh;overflow-y:auto}
#login{margin:10vh auto;max-width:520px;display:flex;align-items:center;gap:14px;padding:18px}
#login .lg{flex:0 0 42%}#login .lg img{width:100%;border-radius:14px;display:block}
#login .lf{flex:1;text-align:left}#login h2{color:var(--g);margin:0 0 2px;font-size:1.2em}#login p{margin:0 0 12px;color:#666;font-size:.85em}
.hl{height:30px;width:30px;border-radius:8px;vertical-align:middle;margin-right:6px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:99px;display:none;z-index:99;font-size:.88em}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;font-size:.88em;gap:8px}
footer{text-align:center;font-size:.75em;color:#5b5b4a;padding:14px 12px 20px;border-top:1px solid #e3dac0}footer a{color:var(--g)}
.hint{font-size:.84em;font-weight:700}
</style></head><body>
<header><div><img class="hl" id="hlogo" alt=""><b id="biz">Haseeb Mirza Mess</b> <small id="sync"></small></div>

<button id="n-dash" onclick="go('dash')">Home</button><button id="n-cust" onclick="go('cust')">Customers</button>
<button id="n-ren" onclick="go('ren')">Renewals</button><button id="n-rep" onclick="go('rep')">Reports</button>
<button id="n-info" onclick="go('info')">App Info</button><button onclick="logout()">Logout</button></nav>

const money=n=>Number(n||0).toFixed(2);
const title=s=>s.trim().toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());

function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3000)}
async function api(a,p={}){
  if(!okApi())throw new Error('Connection not set. Paste your Web app URL on the login screen.');
  const r=await fetch(API,{method:'POST',body:JSON.stringify({a,token:tok,...p})});const j=await r.json();
  if(j.error){if(j.error==='LOGIN')logout();throw new Error(j.error)}return j}
function logout(){sessionStorage.removeItem('t');tok=null;D=null;showLogin()}
function showLogin(){$('nv').style.display=$('addb').style.display='none';
  $('app').innerHTML=`<div id="login" class="box"><div class="lg"><img src="${LOGO}" alt="HM logo"></div><div class="lf"><h2>${'Haseeb Mirza Mess'}</h2><p>Mess Management System</p>

  <button class="btn" style="width:100%" onclick="doLogin()">Login</button></div></div>
  <div class="box" style="max-width:520px;margin:0 auto"><label>${okApi()?'Connection is set ✓':'Step 1 — paste your Apps Script Web app URL (ends with /exec)'}</label>
  <input id="apiurl" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(API)}"><button class="btn o" onclick="saveApi()">Save connection</button></div>`}
function saveApi(){const v=$('apiurl').value.trim();if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(v))return toast('URL must start with https://script.google.com and end with /exec');API=v;localStorage.setItem('api',v);toast('Connection saved');showLogin()}
async function doLogin(){try{const j=await api('login',{password:NEED_PW?$('pw').value:''});tok=j.token;sessionStorage.setItem('t',tok);start()}catch(e){toast(e.message)}}
async function start(){$('sync').textContent='Loading...';try{D=await api('load');$('sync').textContent='';$('biz').textContent=D.settings.business_name+' Mess';
  $('nv').style.display='flex';$('addb').style.display='';go(view)}catch(e){if(e.message!=='LOGIN')toast('Cannot connect: '+e.message)}}
function model(){const exp=+D.settings.expiring_days||7;
  D.cs=D.customers.map(c=>{const all=D.subs.filter(s=>s[1]===c[0]&&s[9]!=='Cancelled').sort((a,b)=>a[6]<b[6]?1:-1),cur=all[0];
    const charges=c[8]==='Cancelled'?0:all.reduce((t,s)=>t+Number(s[7]),0);
    const paid=D.pays.filter(p=>p[2]===c[0]).reduce((t,p)=>t+Number(p[5]),0)+D.adjs.filter(a=>a[2]===c[0]).reduce((t,a)=>t+Number(a[4]),0);
    let st=c[8];if(st==='Active'){if(!cur)st='Expired';else{const d=days(cur[6]);st=d<0?'Expired':d<=exp?'Expiring':'Active'}}
    return{id:c[0],name:c[1],mobile:String(c[2]).replace(/^'/,''),loc:c[5],flat:c[6],map:c[7],cst:c[8],st,cur,end:cur?cur[6]:'',left:cur?days(cur[6]):-999,charges,paid,bal:Math.max(0,charges-paid)}})}
function go(v){view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));const b=$('n-'+v);if(b)b.classList.add('on');render()}
function waLink(c){let m=`Hello ${c.name}, greeting from ${D.settings.business_name} Mess! `,t='Reminder';
  if(c.bal>0&&c.left<0){m+=`Your plan expired on ${fmt(c.end)} and a balance of AED ${money(c.bal)} is pending. Please settle and renew.`;t='Balance'}
  else if(c.bal>0){m+=`Friendly reminder: pending balance is AED ${money(c.bal)} (plan valid until ${fmt(c.end)}). Thank you!`;t='Balance'}
  else if(c.left<0){m+=`Your plan expired on ${fmt(c.end)}. Let us know if you would like to renew.`;t='Renewal'}
  else if(c.left<=7){m+=`Your plan expires on ${fmt(c.end)} (${c.left} day(s) left). Would you like to renew?`}
  else m+=`Your mess plan is active until ${fmt(c.end)}. Thank you!`;
  return{url:`https://wa.me/${waNo(c.mobile)}?text=${encodeURIComponent(m)}`,t}}
function tapWa(id){const c=D.cs.find(x=>x.id===id),l=waLink(c);api('wa',{cid:id,type:l.t,phone:waNo(c.mobile)}).catch(()=>{})}
function card(c){const l=waLink(c);return`<div class="cc ${c.st}"><div class="top" onclick="profile('${c.id}')"><div class="av">${esc(c.name.slice(0,2).toUpperCase())}</div>
<div class="cl"><b>${esc(c.name)}</b><small>${esc(c.cur?c.cur[3]+' • '+c.cur[4]:'No plan')} • ${esc(c.mobile)}</small><small>${c.end?'Ends: '+fmt(c.end):''}</small></div>
<div class="cr"><span class="tag ${c.st}">${c.st}</span><span class="due ${c.bal>0?'':'ok'}">${c.bal>0?'Due: '+money(c.bal)+' AED':'Paid ✓'}</span></div></div>
<div class="cb"><button class="btn o" onclick="formModal('${c.id}')">Renew</button><a class="btn wa" target="_blank" rel="noopener" href="${l.url}" onclick="tapWa('${c.id}')">WhatsApp</a>
${c.bal>0?`<button class="btn t" onclick="payModal('${c.id}')">Pay</button>`:''}${c.cst==='Cancelled'?'':`<button class="btn o" onclick="setSt('${c.id}','Cancelled')">Cancel</button>`}</div></div>`}
function search(l){const s=q.trim().toLowerCase();return l.filter(c=>!s||(c.name+c.mobile+c.id+c.loc+c.flat).toLowerCase().includes(s))}
function render(){if(!D)return;model();const cs=D.cs,ym=today().slice(0,7);
  const col=D.pays.filter(p=>String(p[4]).startsWith(ym)).reduce((t,p)=>t+Number(p[5]),0)+D.adjs.filter(a=>String(a[3]).startsWith(ym)).reduce((t,a)=>t+Number(a[4]),0);
  const out=cs.reduce((t,c)=>t+c.bal,0),n=s=>cs.filter(c=>c.st===s).length;const A=$('app');
  const sb=`<input class="search" placeholder="Search name, phone, ID, area, building" value="${esc(q)}" oninput="q=this.value;render2()">`;
  if(view==='dash'){const urg=c=>c.st==='Expiring'||c.st==='Expired'||c.bal>0,F={urgent:urg,expiring:c=>c.st==='Expiring',expired:c=>c.st==='Expired',unpaid:c=>c.bal>0,all:()=>true};
    A.innerHTML=`${sb}<div class="cash"><div class="a"><small>Collected this month (AED)</small><b>${money(col)}</b></div><div class="b"><small>Outstanding (AED)</small><b>${money(out)}</b></div></div>
<div class="stats"><div class="stat"><b>${cs.length}</b><small>Registered</small></div><div class="stat"><b>${n('Active')}</b><small>Active</small></div><div class="stat"><b>${n('Expiring')}</b><small>Expiring ≤7d</small></div>
<div class="stat"><b>${n('Expired')}</b><small>Expired</small></div><div class="stat"><b>${n('Hold')}</b><small>Hold</small></div><div class="stat"><b>${n('Cancelled')}</b><small>Cancelled</small></div></div>
<div class="chips">${['urgent','expiring','expired','unpaid','all'].map(k=>`<span class="chip ${chip===k?'on':''}" onclick="chip='${k}';render()">${k[0].toUpperCase()+k.slice(1)} (${cs.filter(F[k]).length})</span>`).join('')}</div>
<div id="list">${list(search(cs.filter(F[chip])))}</div>`}
  else if(view==='cust'){A.innerHTML=`${sb}<div class="chips">${['All','Active','Expiring','Expired','Hold','Cancelled'].map(k=>`<span class="chip ${stF===k?'on':''}" onclick="stF='${k}';render()">${k}</span>`).join('')}</div><div id="list">${list(search(cs.filter(c=>stF==='All'||c.st===stF)))}</div>`}
  else if(view==='ren'){A.innerHTML=`<select onchange="renF=this.value;render()">${[['3','Expiring in 3 days'],['7','Expiring in 7 days'],['30','Expiring in 30 days'],['x','Expired']].map(o=>`<option value="${o[0]}" ${renF===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>
<div id="list">${list(cs.filter(c=>c.cst==='Active'&&(renF==='x'?c.left<0:c.left>=0&&c.left<=+renF)))}</div>`}
  else if(view==='info'){const S=D.settings;A.innerHTML=`<div class="box" style="text-align:center"><img src="${LOGO}" style="width:140px;border-radius:16px"><h2 style="color:var(--g);margin:8px 0 2px">Haseeb Mirza Mess Management System</h2><small>Version 1.0 • Google Sheets edition</small></div>
<div class="box"><div class="row"><span>Business</span><b>${esc(S.business_name)}</b></div><div class="row"><span>Location</span><b>${esc(S.address)}</b></div><div class="row"><span>Contact</span><b><a href="tel:+971507256801">${esc(S.contact)}</a></b></div>
<div class="row"><span>Currency / Time zone</span><b>${esc(S.currency)} / ${esc(S.timezone)}</b></div><div class="row"><span>Date format</span><b>DD/MM/YYYY</b></div><div class="row"><span>Database</span><b>Google Sheet</b></div></div>
<div class="box"><b>Ownership</b><p style="margin:6px 0 0;font-size:.88em">© 2026 Haseeb Mirza. All Rights Reserved. Designed, Developed &amp; Owned by Haseeb Mirza. Unauthorized copying, reproduction, modification, redistribution or commercial use of this software is prohibited without prior written permission.</p></div>`}
  else{const f=parse($('rf')?.value||'')||'0000-00-00',t=parse($('rt')?.value||'')||'9999-12-31';
    const rows=cs.map(c=>{const ch=D.subs.filter(s=>s[1]===c.id&&s[9]!=='Cancelled'&&s[5]>=f&&s[5]<=t).reduce((x,s)=>x+Number(s[7]),0),
      rc=D.pays.filter(p=>p[2]===c.id&&p[4]>=f&&p[4]<=t).reduce((x,p)=>x+Number(p[5]),0)+D.adjs.filter(a=>a[2]===c.id&&a[3]>=f&&a[3]<=t).reduce((x,a)=>x+Number(a[4]),0);return{c,ch,rc}}).filter(r=>r.ch||r.rc);
    const T=k=>rows.reduce((x,r)=>x+r[k],0);
    A.innerHTML=`<div class="box"><b>Charges &amp; Balance</b><div class="two"><div><label>From (dd/mm/yyyy)</label><input id="rf" value="${esc($('rf')?.value||'')}"></div><div><label>To (dd/mm/yyyy)</label><input id="rt" value="${esc($('rt')?.value||'')}"></div></div>
<button class="btn" onclick="render()">Show</button></div><div class="cash"><div class="a"><small>Received</small><b>${money(T('rc'))}</b></div><div class="b"><small>Charges</small><b>${money(T('ch'))}</b></div></div>
${rows.map(r=>`<div class="cc"><div class="row"><b>${esc(r.c.name)}</b><span class="tag ${r.c.st}">${r.c.st}</span></div><div class="row"><span>Charges</span><span>${money(r.ch)}</span></div><div class="row"><span>Received</span><span>${money(r.rc)}</span></div>
<div class="row"><b>Balance</b><b class="due">${money(r.ch-r.rc)}</b></div><div class="cb"><a class="btn o" href="tel:${esc(r.c.mobile)}">Call</a><a class="btn wa" target="_blank" href="${waLink(r.c).url}" onclick="tapWa('${r.c.id}')">WhatsApp</a></div></div>`).join('')||'<div class="box">No records in this period.</div>'}`}}
const list=a=>a.slice(0,10*(window.pg||1)).map(card).join('')+(a.length>10*(window.pg||1)?`<button class="btn o" style="width:100%" onclick="pg=(window.pg||1)+1;render()">Show more (${a.length-10*(window.pg||1)} left)</button>`:'')||'<div class="box" style="text-align:center;color:#666">Nothing here.</div>';
function render2(){const x=$('app').querySelector('.search');const v=q,p=x.selectionStart;render();const y=$('app').querySelector('.search');y.focus();y.setSelectionRange(p,p)}
function openM(h){$('mc').innerHTML=h;$('modal').classList.add('open')}function closeM(){$('modal').classList.remove('open')}
function formModal(cid){const c=cid?D.cs.find(x=>x.id===cid):null,P=D.plans;
  openM(`<h3 style="margin-top:0;color:var(--g)">${c?'Renew — '+esc(c.name):'Add New Client'}</h3>
${c?'':`<label>Name *</label><input id="f_n"><label>Mobile no *</label><input id="f_m" inputmode="tel" placeholder="05XXXXXXXX"><label>Location</label><input id="f_l"><div class="two"><div><label>Flat / Building</label><input id="f_f"></div><div><label>Map link</label><input id="f_p"></div></div>`}
<div class="two"><div><label>Meal plan</label><select id="f_pl" onchange="calc()">${P.map(p=>`<option value="${p[0]}">${esc(p[1])}</option>`).join('')}</select></div>
<div><label>Service</label><select id="f_s" onchange="calc()"><option>Table service</option><option>Delivery / Parcel</option></select></div></div>
<div class="two"><div><label>Price (AED)</label><input id="f_pr" type="number" oninput="live()"></div><div><label>Start date (dd/mm/yyyy)</label><input id="f_d" value="${fmt(today())}"></div></div>
<label>Payment (AED)</label><input id="f_pd" type="number" oninput="live()"><div id="hint" class="hint"></div>
<div class="cb" style="margin-top:8px"><button class="btn" id="sv" onclick="saveForm('${cid||''}')">Save</button><button class="btn o" onclick="closeM()">Cancel</button></div>`);calc()}
function calc(){const p=D.plans.find(x=>x[0]===$('f_pl').value);$('f_pr').value=$('f_s').value==='Delivery / Parcel'?p[4]:p[3];$('f_pd').value=$('f_pr').value;live()}
function live(){const d=Number($('f_pr').value)-Number($('f_pd').value);$('hint').innerHTML=d>0?`<span style="color:var(--t)">Balance due: ${money(d)} AED</span>`:d<0?`<span style="color:var(--t)">Payment is more than price</span>`:'<span style="color:var(--g)">Paid in full ✓</span>'}
async function saveForm(cid){if(busy)return;const st=parse($('f_d').value);if(!st)return toast('Date must be dd/mm/yyyy');
  const b={planId:$('f_pl').value,service:$('f_s').value,price:$('f_pr').value,paid:$('f_pd').value||0,start:st,key:crypto.randomUUID()};
  if(Number(b.paid)>Number(b.price))return toast('Payment is more than price');
  if(cid)b.cid=cid;else{b.name=title($('f_n').value);b.mobile=$('f_m').value.trim();b.loc=$('f_l').value;b.flat=$('f_f').value;b.map=$('f_p').value;
    if(!b.name||b.mobile.replace(/\D/g,'').length<9)return toast('Name and valid mobile required');
    if(D.cs.some(c=>c.name.toLowerCase()===b.name.toLowerCase()||waNo(c.mobile)===waNo(b.mobile))&&!confirm('A customer with this name or mobile already exists. Add anyway?'))return}
  await act(cid?'renew':'add',b)}
function payModal(id){const c=D.cs.find(x=>x.id===id);openM(`<h3 style="margin-top:0;color:var(--g)">Record Payment — ${esc(c.name)}</h3><p>Balance due: <b>${money(c.bal)} AED</b></p>
<label>Amount (AED)</label><input id="p_a" type="number" value="${c.bal}"><div class="cb"><button class="btn" onclick="doPay('${id}',${c.bal})">Confirm</button><button class="btn o" onclick="closeM()">Cancel</button></div>`)}
async function doPay(id,max){const a=Number($('p_a').value);if(!(a>0))return toast('Enter amount');if(a>max)return toast('More than balance due');await act('pay',{cid:id,amount:a,date:today(),key:crypto.randomUUID()})}
function profile(id){const c=D.cs.find(x=>x.id===id),ps=D.pays.filter(p=>p[2]===id);
  openM(`<h3 style="margin:0;color:var(--g)">${esc(c.name)} <span class="tag ${c.st}">${c.st}</span></h3><small>${esc(c.id)} • ${esc(c.mobile)} • ${esc(c.loc)} ${esc(c.flat)} ${c.map?`• <a href="${esc(c.map)}" target="_blank">Map</a>`:''}</small>
<div class="row"><span>Charges</span><b>${money(c.charges)}</b></div><div class="row"><span>Received</span><b>${money(c.paid)}</b></div><div class="row"><span>Balance</span><b class="due">${money(c.bal)}</b></div>
<h4>Payments</h4>${ps.map(p=>{const rv=D.adjs.find(a=>a[1]===p[0]);return`<div class="row"><span>${fmt(p[4])} • ${esc(p[1])} • ${money(p[5])}${rv?` <i>(reversed: ${esc(rv[5])})</i>`:''}</span>${rv?'':`<button class="btn o" style="padding:4px 8px" onclick="rev('${p[0]}')">Reverse</button>`}</div>`}).join('')||'<small>No payments.</small>'}
<div class="cb" style="margin-top:10px;flex-wrap:wrap"><button class="btn" onclick="formModal('${id}')">Renew</button>${c.bal>0?`<button class="btn t" onclick="payModal('${id}')">Pay</button>`:''}
${c.cst==='Hold'||c.cst==='Cancelled'?`<button class="btn o" onclick="setSt('${id}','Active')">Reactivate</button>`:`<button class="btn o" onclick="setSt('${id}','Hold')">Hold</button><button class="btn o" onclick="setSt('${id}','Cancelled')">Cancel</button>`}
<button class="btn o" onclick="closeM()">Close</button></div>`)}
async function rev(pid){const r=prompt('Reason for reversing this payment (required):');if(!r||r.trim().length<3)return toast('Written reason required');await act('reverse',{pid,reason:r,key:crypto.randomUUID()})}
async function setSt(id,s){if(!confirm(`Set this customer to ${s}?`))return;await act('status',{cid:id,status:s})}
async function act(a,p){if(busy)return;busy=true;try{D=await api(a,p);closeM();toast('Saved');render()}catch(e){toast(e.message)}finally{busy=false}}
$('hlogo').src=LOGO;
tok?start():showLogin();
</script></body></html>
